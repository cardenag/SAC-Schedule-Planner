<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>RSCCD Schedule Planner</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#1b2321;background:#eef1ef}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
main{width:min(620px,100%);background:#fff;border:1px solid #d7deda;border-radius:14px;padding:28px;box-shadow:0 10px 30px rgba(0,0,0,.08);text-align:center}
h1{margin:0 0 8px;font-size:24px}p{color:#5c6b66;line-height:1.55}
a{display:inline-block;margin-top:12px;background:#1f6f64;color:#fff;text-decoration:none;font-weight:700;padding:11px 18px;border-radius:8px}
.small{font-size:12px;color:#8b9793;margin-top:16px}
</style>
<script>
window.addEventListener('DOMContentLoaded',function(){
  var url="https://script.google.com/macros/s/AKfycbwiLF6lQKrnqn5Bi051gux77ayejAGTBTC6n6jbtjnsyUTTY204-Btz7jHMRI4L5fB51Q/exec";
  var link=document.getElementById('openLivePlanner');
  if(link)link.href=url;
  var status=document.getElementById('launchStatus');
  if(status)status.textContent='Opening the live Apps Script planner…';
  setTimeout(function(){window.location.assign(url);},900);
});
</script>
</head>
<body>
<main>
<h1>RSCCD Schedule Planner</h1>
<p id="launchStatus">Preparing the live shared Schedule Planner…</p>
<a id="openLivePlanner" href="https://script.google.com/macros/s/AKfycbwiLF6lQKrnqn5Bi051gux77ayejAGTBTC6n6jbtjnsyUTTY204-Btz7jHMRI4L5fB51Q/exec">Open live planner</a>
<p class="small">If you are not redirected automatically, use the button above.</p>
</main>
</body>
</html>
